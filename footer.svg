<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ft fd">
  <title id="ft">Sávio Domingos</title>
  <desc id="fd">A melhor forma de aprender é criando.</desc>
  <defs>
    <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F0A202" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#F0A202" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#F0A202" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F0A202" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name  { font: 700 18px 'Space Grotesk','Segoe UI',sans-serif; fill: #E8ECF1; }
    .quote { font: 500 12px 'JetBrains Mono', monospace; fill: #7C8494; letter-spacing: .5; }
    .dash  { animation: flow 4s linear infinite; }
    .halo  { animation: breathe 4s ease-in-out infinite; }
    .caret { animation: blink 1.1s step-end infinite; }
    @keyframes flow    { to { stroke-dashoffset: -40; } }
    @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes blink   { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .dash, .halo, .caret { animation: none; }
    }
  </style>

  <rect width="900" height="110" fill="url(#bgf)"/>
  <line x1="0" y1="0.5" x2="900" y2="0.5" stroke="url(#lineGrad)" stroke-width="2"/>
  <line class="dash" x1="0" y1="4" x2="900" y2="4" stroke="#F0A202"
        stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 14"/>

  <circle class="halo" cx="450" cy="55" r="150" fill="url(#halo)"/>

  <text x="450" y="52" text-anchor="middle" class="name">Sávio Domingos</text>
  <text x="450" y="76" text-anchor="middle" class="quote">"A melhor forma de aprender é criando."</text>
  <rect class="caret" x="595" y="65" width="7" height="13" fill="#3DDC97"/>
</svg>
